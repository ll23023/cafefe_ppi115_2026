<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="jakarta.faces.composite/components"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Cafefe - Productos</ui:define>
    <ui:define name="header_title">Productos</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Productos</h2>

            <h:form id="frmProducto">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre"
                                 value="#{productoModel.registro.nombre}"
                                 required="true"
                                 maxlength="155" />
                    <p:messages for="nombre" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo"
                                             value="#{productoModel.registro.activo}"
                                             itemLabel="Activo" />
                    <h:panelGroup />

                    <h:outputLabel for="comentarios" value="Comentarios" />
                    <p:inputTextarea id="comentarios"
                                     value="#{productoModel.registro.comentarios}"
                                     rows="3" cols="50" />
                    <p:messages for="comentarios" />

                    <h:outputLabel for="precioSugerido" value="Precio sugerido:" />
                    <p:inputNumber id="precioSugerido"
                                   value="#{productoModel.registro.precioSugerido}"
                                   required="true"
                                   maxValue="50.00"
                                   minValue="0"
                                   decimalPlaces="2" />
                    <p:messages for="precioSugerido" />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:btnsForm model="#{productoModel}"
                                saveUpdate="frmProducto frmTablaProducto"
                                newUpdate="frmProducto frmTablaProducto" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Productos</h3>
            <h:form id="frmTablaProducto">
                <c:tablaDinamica model="#{productoModel}"
                                 columns="#{productoModel.columnas}"
                                 rowKey="idProducto"
                                 editUpdate="frmProducto"
                                 deleteUpdate="frmTablaProducto frmProducto" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
