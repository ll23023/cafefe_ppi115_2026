<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" xmlns:f="jakarta.faces.core" xmlns:c="jakarta.faces.composite/components"
    template="/resources/templates/basic.xhtml">
    <ui:define name="page_title">Productos y Tipos</ui:define>
    <ui:define name="header_title">Administración de Productos y Tipos</ui:define>
    <ui:define name="content">
        <div class="card">
            <h2>Administración de Productos y Tipos</h2>
            <h:form id="frmProductoTipoProducto">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="producto" value="Producto:" />
                    <p:selectOneMenu id="producto" value="#{productoTipoProductoModel.registro.idProducto}"
                        required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{productoTipoProductoModel.productos}" var="producto"
                            itemLabel="#{producto.nombre}" itemValue="#{producto}" />
                    </p:selectOneMenu>
                    <p:messages for="producto" />
                    <h:outputLabel for="tipo" value="Tipo de producto:" />
                    <p:selectOneMenu id="tipo" value="#{productoTipoProductoModel.registro.idTipoProducto}"
                        required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{productoTipoProductoModel.tiposProducto}" var="tipo"
                            itemLabel="#{tipo.nombre}" itemValue="#{tipo}" />
                    </p:selectOneMenu>
                    <p:messages for="tipo" />
                    <h:outputLabel for="fecha" value="Fecha de creación:" />
                    <p:datePicker id="fecha" value="#{productoTipoProductoModel.registro.fechaCreacion}"
                        showTime="true" />
                    <p:messages for="fecha" />
                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{productoTipoProductoModel.registro.observaciones}"
                        rows="3" />
                    <p:messages for="observaciones" />
                </h:panelGrid>
                <c:btnsForm model="#{productoTipoProductoModel}"
                    saveUpdate="frmProductoTipoProducto frmTablaProductoTipoProducto"
                    newUpdate="frmProductoTipoProducto frmTablaProductoTipoProducto" />
            </h:form>
        </div>
        <div class="card">
            <h3>Lista de Relaciones</h3>
            <h:form id="frmTablaProductoTipoProducto">
                <c:tablaDinamica model="#{productoTipoProductoModel}" columns="#{productoTipoProductoModel.columnas}"
                    rowKey="idProductoTipoProducto" editUpdate="frmProductoTipoProducto"
                    deleteUpdate="frmTablaProductoTipoProducto frmProductoTipoProducto" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
