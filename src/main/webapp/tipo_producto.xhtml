<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="http://xmlns.jcp.org/jsf/composite/components">
                                                                                                                                                                                                                                                                                                                           
    <!--Para usar una plantilla debes agregar exactamente todo como está arriba y usas las etiquetas define para poder cambiar el conenido de la página-->
    <ui:define name="page_title">Prueba de plantilla</ui:define>
    <ui:define name="header_title">Test</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Tipos de Producto</h2>

            <h:form id="frmTipoProducto">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre del Producto:" />
                    <p:inputText id="nombre" value="#{tipoProductoModel.registro.nombre}" required="true" />
                    <p:messages for="nombre" />

                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{tipoProductoModel.registro.observaciones}"
                                     rows="3" cols="50" />
                    <p:messages for="observaciones" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo" value="#{tipoProductoModel.registro.activo}"
                                             itemLabel="Activo" />
                    <h:panelGroup />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <!-- Ahora para usar los botónes del formulario se debe usar este componente -->
                    <c:formActions model="#{tipoProductoModel}"
                                   saveUpdate="frmTipoProducto frmTablaProducto"
                                   newUpdate="frmTipoProducto frmTablaProducto" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Tipos de Producto</h3>
            <h:form id="frmTablaProducto">
                <p:dataTable value="#{tipoProductoModel.registros}" var="item" styleClass="tabla"
                             selectionMode="single" selection="#{tipoProductoModel.seleccion}"
                             rowKey="#{item.idTipoProducto}"
                             paginator="true" rows="10" emptyMessage="No hay registros">
                        <p:ajax event="rowSelect" update="botonera" />

                    <p:ajax event="rowUnselect" update="botonera" />
                    <p:column headerText="ID" style="font-size: 0.8em;">
                        #{item.idTipoProducto}
                    </p:column>
                    <p:column headerText="Nombre">
                        #{item.nombre}
                    </p:column>
                    <p:column headerText="Estado">
                        #{item.activo ? 'ACTIVO' : 'INACTIVO'}
                    </p:column>
                    <p:column headerText="Observaciones">
                        #{item.observaciones}
                    </p:column>
                </p:dataTable>

                <h:panelGroup id="botonera" layout="block" style="margin-top: 12px;">
                    <!-- Ahora para usar los botónes de las tablas se debe usar este componente -->
                    <c:crudActions model="#{tipoProductoModel}"
                                   editUpdate="frmTipoProducto"
                                   deleteUpdate="frmTablaProducto frmTipoProducto" />
                    &#160;
                    <h:outputText value="Seleccione una fila de la tabla para editar o eliminar"
                                  rendered="#{empty tipoProductoModel.seleccion}"
                                  style="color:#777; font-style: italic;" />
                </h:panelGroup>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
