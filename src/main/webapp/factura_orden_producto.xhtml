<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="jakarta.faces.composite/components"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Administración de Factura-Orden-Producto</ui:define>
    <ui:define name="header_title">Factura-Orden-Producto</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Factura-Orden-Producto</h2>

            <h:form id="frmFacturaOrdenProducto">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="factura" value="Factura:" />
                    <p:selectOneMenu id="factura"
                                     value="#{facturaOrdenProductoModel.registro.idFactura}"
                                     required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{facturaOrdenProductoModel.facturas}"
                                       var="f"
                                       itemLabel="#{f.cliente} (#{f.estado})"
                                       itemValue="#{f}" />
                    </p:selectOneMenu>
                    <p:messages for="factura" />

                    <h:outputLabel for="ordenProducto" value="Producto:" />
                    <p:selectOneMenu id="ordenProducto"
                                     value="#{facturaOrdenProductoModel.registro.idOrdenProducto}"
                                     required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{facturaOrdenProductoModel.ordenProductos}"
                                       var="op"
                                       itemLabel="$#{op.precio} - #{op.observaciones}"
                                       itemValue="#{op}" />
                    </p:selectOneMenu>
                    <p:messages for="ordenProducto" />

                    <h:outputLabel for="precio" value="Precio:" />
                    <p:inputNumber id="precio"
                                   value="#{facturaOrdenProductoModel.registro.precio}"
                                   symbol="$ "
                                   decimalPlaces="2" />
                    <p:messages for="precio" />

                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones"
                                     value="#{facturaOrdenProductoModel.registro.observaciones}"
                                     rows="3" cols="50" />
                    <p:messages for="observaciones" />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:btnsForm model="#{facturaOrdenProductoModel}"
                                saveUpdate="frmFacturaOrdenProducto frmTablaFacturaOrdenProducto"
                                newUpdate="frmFacturaOrdenProducto frmTablaFacturaOrdenProducto" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Factura-Orden-Producto</h3>
            <h:form id="frmTablaFacturaOrdenProducto">
                <c:tablaDinamica model="#{facturaOrdenProductoModel}"
                                  columns="#{facturaOrdenProductoModel.columnas}"
                                  rowKey="idFacturaOrdenProducto"
                                  editUpdate="frmFacturaOrdenProducto"
                                  deleteUpdate="frmTablaFacturaOrdenProducto frmFacturaOrdenProducto" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
