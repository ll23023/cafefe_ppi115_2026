<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="jakarta.faces.composite/components"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Cafefe - Roles</ui:define>
    <ui:define name="header_title">Roles</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Roles</h2>

            <h:form id="frmRol">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre"
                                 value="#{rolModel.registro.nombre}"
                                 required="true"
                                 maxlength="155" />
                    <p:messages for="nombre" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo"
                                              value="#{rolModel.registro.activo}"
                                              itemLabel="Activo" />
                    <h:panelGroup />

                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones"
                                     value="#{rolModel.registro.observaciones}"
                                     rows="3" cols="50" />
                    <p:messages for="observaciones" />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:btnsForm model="#{rolModel}"
                                saveUpdate="frmRol frmTablaRol"
                                newUpdate="frmRol frmTablaRol" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Roles</h3>
            <h:form id="frmTablaRol">
                <c:tablaDinamica model="#{rolModel}"
                                  columns="#{rolModel.columnas}"
                                  rowKey="idRol"
                                  editUpdate="frmRol"
                                  deleteUpdate="frmTablaRol frmRol" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
