<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="http://xmlns.jcp.org/jsf/composite/components">

    <ui:define name="page_title">Gestión de Roles</ui:define>
    <ui:define name="header_title">Roles</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Roles</h2>

            <h:form id="frmRol">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre del Rol:" />
                    <p:inputText id="nombre" value="#{rolModel.registro.nombre}" required="true" />
                    <p:messages for="nombre" />

                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{rolModel.registro.observaciones}"
                                     rows="3" cols="50" />
                    <p:messages for="observaciones" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo" value="#{rolModel.registro.activo}"
                                             itemLabel="Activo" />
                    <h:panelGroup />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:btnsForm model="#{rolModel}"
                                   saveUpdate="frmRol frmTablaRol"
                                   newUpdate="frmRol frmTablaRol" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Roles</h3>
            <h:form id="frmTablaRol">
                <p:dataTable value="#{rolModel.registros}" var="item" styleClass="tabla"
                             selectionMode="single" selection="#{rolModel.seleccion}"
                             rowKey="#{item.idRol}"
                             paginator="true" rows="10" emptyMessage="No hay registros">

                    <p:ajax event="rowSelect" update="botonera" />
                    <p:ajax event="rowUnselect" update="botonera" />

                    <p:column headerText="ID" style="font-size: 0.8em;">
                        #{item.idRol}
                    </p:column>
                    <p:column headerText="Nombre">
                        #{item.nombre}
                    </p:column>
                    <p:column headerText="Estado">
                        #{item.activo ? 'ACTIVO' : 'INACTIVO'}
                    </p:column>
                    <p:column headerText="Observaciones">
                        #{item.observaciones}
                    </p:column>
                </p:dataTable>

                <h:panelGroup id="botonera" layout="block" style="margin-top: 12px;">
                    <c:btnsTabla model="#{rolModel}"
                                   editUpdate="frmRol"
                                   deleteUpdate="frmTablaRol frmRol" />
                    &#160;
                    <h:outputText value="Seleccione una fila de la tabla para editar o eliminar"
                                  rendered="#{empty rolModel.seleccion}"
                                  style="color:#777; font-style: italic;" />
                </h:panelGroup>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
