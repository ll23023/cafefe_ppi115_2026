<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces" xmlns:c="jakarta.faces.composite/components" template="/resources/templates/basic.xhtml">
    <ui:define name="page_title">Cajas</ui:define>
    <ui:define name="header_title">Administración de Cajas</ui:define>
    <ui:define name="content">
        <div class="card">
            <h2>Administración de Cajas</h2>
            <h:form id="frmCaja">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre" value="#{cajaModel.registro.nombre}" required="true" />
                    <p:messages for="nombre" />
                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo" value="#{cajaModel.registro.activo}" itemLabel="Activo" />
                    <h:panelGroup />
                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones" value="#{cajaModel.registro.observaciones}" rows="3" />
                    <p:messages for="observaciones" />
                </h:panelGrid>
                <c:btnsForm model="#{cajaModel}" saveUpdate="frmCaja frmTablaCaja" newUpdate="frmCaja frmTablaCaja" />
            </h:form>
        </div>
        <div class="card">
            <h3>Lista de Cajas</h3>
            <h:form id="frmTablaCaja">
                <c:tablaDinamica model="#{cajaModel}" columns="#{cajaModel.columnas}" rowKey="idCaja"
                    editUpdate="frmCaja" deleteUpdate="frmTablaCaja frmCaja" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
