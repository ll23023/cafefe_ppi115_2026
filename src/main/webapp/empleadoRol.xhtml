<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="http://xmlns.jcp.org/jsf/composite/components"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Administración de Empleado-Rol</ui:define>
    <ui:define name="header_title">Empleado-Rol</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Empleado-Rol</h2>

            <h:form id="frmEmpleadoRol">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="empleado" value="Empleado:" />
                    <p:selectOneMenu id="empleado"
                                     value="#{empleadoRolModel.registro.idEmpleado}"
                                     required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{empleadoRolModel.empleados}"
                                       var="emp"
                                       itemLabel="#{emp.nombre} #{emp.apellido}"
                                       itemValue="#{emp}" />
                    </p:selectOneMenu>
                    <p:selectOneMenu id="rol"
                                     value="#{empleadoRolModel.registro.idRol}"
                                     required="true">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{empleadoRolModel.roles}"
                                       var="r"
                                       itemLabel="#{r.nombre}"
                                       itemValue="#{r}" />
                    </p:selectOneMenu>
                    <p:messages for="rol" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo"
                                             value="#{empleadoRolModel.registro.activo}"
                                             itemLabel="Activo" />
                    <h:panelGroup />

                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones"
                                     value="#{empleadoRolModel.registro.observaciones}"
                                     rows="3" cols="50" />
                    <p:messages for="observaciones" />

                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:formActions model="#{empleadoRolModel}"
                                   saveUpdate="frmEmpleadoRol frmTablaEmpleadoRol"
                                   newUpdate="frmEmpleadoRol frmTablaEmpleadoRol" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Empleado-Rol</h3>
            <h:form id="frmTablaEmpleadoRol">
                <p:dataTable value="#{empleadoRolModel.registros}" var="item" styleClass="tabla"
                             selectionMode="single" selection="#{empleadoRolModel.seleccion}"
                             rowKey="#{item.idEmpleadoRol}"
                             paginator="true" rows="10" emptyMessage="No hay registros">

                    <p:ajax event="rowSelect" update="botonera" />
                    <p:ajax event="rowUnselect" update="botonera" />

                    <p:column headerText="ID" style="font-size: 0.8em;">
                        #{item.idEmpleadoRol}
                    </p:column>
                    <p:column headerText="Empleado">
                        <h:outputText value="#{item.idEmpleado.nombre} #{item.idEmpleado.apellido}"
                                      rendered="#{item.idEmpleado != null}" />
                    </p:column>
                    <p:column headerText="Rol">
                        #{item.idRol != null ? item.idRol.nombre : ''}
                    </p:column>
                    <p:column headerText="Estado">
                        #{item.activo ? 'ACTIVO' : 'INACTIVO'}
                    </p:column>
                    <p:column headerText="Observaciones">
                        #{item.observaciones}
                    </p:column>
                </p:dataTable>

                <h:panelGroup id="botonera" layout="block" style="margin-top: 12px;">
                    <c:crudActions model="#{empleadoRolModel}"
                                   editUpdate="frmEmpleadoRol"
                                   deleteUpdate="frmTablaEmpleadoRol frmEmpleadoRol" />
                    &#160;
                    <h:outputText value="Seleccione una fila de la tabla para editar o eliminar"
                                  rendered="#{empty empleadoRolModel.seleccion}"
                                  style="color:#777; font-style: italic;" />
                </h:panelGroup>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
