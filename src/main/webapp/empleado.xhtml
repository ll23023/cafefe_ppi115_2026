<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:c="jakarta.faces.composite/components"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Administración de Empleados</ui:define>
    <ui:define name="header_title">Empleados</ui:define>

    <ui:define name="content">
        <div class="card">
            <h2>Administración de Empleados</h2>

            <h:form id="frmEmpleado">
                <h:panelGrid columns="3" cellpadding="5">
                    <h:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre"
                                 value="#{empleadoModel.registro.nombre}"
                                 required="true"
                                 maxlength="255" />
                    <p:messages for="nombre" />

                    <h:outputLabel for="apellido" value="Apellido:" />
                    <p:inputText id="apellido"
                                 value="#{empleadoModel.registro.apellido}"
                                 required="true"
                                 maxlength="255" />
                    <p:messages for="apellido" />

                    <h:outputLabel for="activo" value="Estado:" />
                    <p:selectBooleanCheckbox id="activo"
                                              value="#{empleadoModel.registro.activo}"
                                              itemLabel="Activo" />
                    <h:panelGroup />

                    <h:outputLabel for="comentarios" value="Comentarios:" />
                    <p:inputTextarea id="comentarios"
                                     value="#{empleadoModel.registro.comentarios}"
                                     rows="3" cols="50" />
                    <p:messages for="comentarios" />
                </h:panelGrid>

                <div style="margin-top: 10px;">
                    <c:btnsForm model="#{empleadoModel}"
                                saveUpdate="frmEmpleado frmTablaEmpleado"
                                newUpdate="frmEmpleado frmTablaEmpleado" />
                </div>
            </h:form>
        </div>

        <div class="card">
            <h3>Lista de Empleados</h3>
            <h:form id="frmTablaEmpleado">
                <c:tablaDinamica model="#{empleadoModel}"
                                  columns="#{empleadoModel.columnas}"
                                  rowKey="idEmpleado"
                                  editUpdate="frmEmpleado"
                                  deleteUpdate="frmTablaEmpleado frmEmpleado" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
