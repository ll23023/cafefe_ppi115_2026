<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:cc="jakarta.faces.composite"
              xmlns:p="primefaces"
              xmlns:f="jakarta.faces.core">
    <cc:interface>
        <cc:attribute name="model" required="true" />
        <cc:attribute name="saveUpdate" required="true" />
        <cc:attribute name="newUpdate" required="true" />
    </cc:interface>
    <cc:implementation>
        <p:commandButton value="#{cc.attrs.model.editando ? 'Guardar edición' : 'Guardar'}"
                         action="#{cc.attrs.model.btnGuardarHandler}"
                         process="@form"
                         update="#{cc.attrs.saveUpdate}"
                         styleClass="btn btn-primary" />
        &#160;
        <p:commandButton value="#{cc.attrs.model.editando ? 'Cancelar' : 'Nuevo'}"
                         action="#{cc.attrs.model.btnNuevoHandler}"
                         process="@this"
                         resetValues="true"
                         update="#{cc.attrs.newUpdate}"
                         styleClass="btn btn-secondary" />
    </cc:implementation>
</ui:component>
