<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/resources/templates/basic.xhtml"
                xmlns:p="primefaces"
                xmlns:f="jakarta.faces.core">

    <ui:define name="page_title">Cafefe - Descuentos</ui:define>
    <ui:define name="header_title">Administración de Descuentos</ui:define>

    <ui:define name="main_form">
        <p:growl id="growl" showDetail="false" />

        <section class="main_form">
            <h:form id="frmDescuento" styleClass="form_grid">
                <h2>#{descuentoModel.editando ? 'Editar descuento' : 'Nuevo descuento'}</h2>

                <div class="custom_input">
                    <h:outputLabel for="nombre" value="Nombre:" />
                    <p:inputText id="nombre"
                                 value="#{descuentoModel.registro.nombre}"
                                 required="true" />
                    <p:message for="nombre" />
                </div>

                <div class="custom_input">
                    <h:outputLabel for="tipo" value="Tipo de descuento:" />
                    <p:selectOneMenu id="tipo"
                                     value="#{descuentoModel.idTipoSel}"
                                     required="true"
                                     disabled="#{!descuentoModel.creando}">
                        <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}" noSelectionOption="true" />
                        <f:selectItems value="#{descuentoModel.tiposDescuento}"
                                       var="t"
                                       itemLabel="#{t.nombre} (máx. #{t.descuentoMaximo}%)#{t.activo ? '' : ' - inactivo'}"
                                       itemValue="#{t.idTipoDescuento.toString()}"
                                       itemDisabled="#{!t.activo}" />
                    </p:selectOneMenu>
                    <p:message for="tipo" />
                </div>

                <div class="custom_input">
                    <h:outputLabel for="desde" value="Vigente desde:" />
                    <p:datePicker id="desde"
                                  value="#{descuentoModel.registro.fechaDesde}"
                                  showTime="true"
                                  showButtonBar="true"
                                  pattern="dd/MM/yyyy HH:mm"
                                  appendTo="@(body)"
                                  required="true" />
                    <p:message for="desde" />
                </div>

                <div class="custom_input">
                    <h:outputLabel for="hasta" value="Vigente hasta:" />
                    <p:datePicker id="hasta"
                                  value="#{descuentoModel.registro.fechaHasta}"
                                  showTime="true"
                                  showButtonBar="true"
                                  pattern="dd/MM/yyyy HH:mm"
                                  appendTo="@(body)" />
                    <p:message for="hasta" />
                </div>

                <div class="custom_input">
                    <h:outputLabel for="observaciones" value="Observaciones:" />
                    <p:inputTextarea id="observaciones"
                                     value="#{descuentoModel.registro.observaciones}"
                                     rows="3" />
                    <p:message for="observaciones" />
                </div>

                <div class="form_buttons">
                    <p:commandButton value="#{descuentoModel.editando ? 'Guardar edición' : 'Guardar'}"
                                     action="#{descuentoModel.btnGuardarHandler}"
                                     process="@form"
                                     update=":frmDescuento :frmDetalle :frmLista :growl"
                                     styleClass="btn btn-primary" />
                    <p:commandButton value="#{descuentoModel.editando ? 'Cancelar' : 'Nuevo'}"
                                     action="#{descuentoModel.cancelar}"
                                     process="@this"
                                     resetValues="true"
                                     update=":frmDescuento :frmDetalle :frmLista :growl"
                                     styleClass="btn btn-secondary" />
                </div>
            </h:form>
        </section>
    </ui:define>

    <ui:define name="main_data">
        <section class="item_sublist">
            <h:form id="frmDetalle">
                <div class="item_sublist_header">
                    <h2>Productos relacionados</h2>
                </div>

                <h:outputText value="Descuento: #{descuentoModel.seleccion.nombre}"
                              rendered="#{not empty descuentoModel.seleccion}" />

                <p:dataTable id="tblProductos"
                             var="dp"
                             value="#{descuentoModel.productosDelDescuento}"
                             paginator="true"
                             paginatorPosition="bottom"
                             rows="5"
                             styleClass="tabla"
                             emptyMessage="#{empty descuentoModel.seleccion ? 'Seleccione un descuento en la lista' : 'Este descuento todavía no se aplica a ningún producto'}">
                    <p:column headerText="Producto">
                        <h:outputText value="#{dp.idProducto.nombre}" />
                    </p:column>

                    <p:column headerText="Precio sugerido">
                        <h:outputText value="#{dp.idProducto.precioSugerido}">
                            <f:convertNumber type="currency" currencySymbol="$" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Valor (%)">
                        <h:outputText value="#{dp.valor}" />
                    </p:column>

                    <p:column headerText="Desde">
                        <h:outputText value="#{descuentoModel.fechaTexto(dp.fechaDesde)}" />
                    </p:column>

                    <p:column headerText="Hasta">
                        <h:outputText value="#{descuentoModel.fechaHastaTexto(dp.fechaHasta)}" />
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{dp.observaciones}" />
                    </p:column>
                </p:dataTable>
            </h:form>
        </section>
    </ui:define>

    <ui:define name="main_list">
        <h:form id="frmLista">
            <article class="main_item_list">
                <h2>Descuentos</h2>
                <p:dataTable id="tblDescuentos"
                             var="d"
                             value="#{descuentoModel.registros}"
                             rowKey="#{d.idDescuento}"
                             selection="#{descuentoModel.seleccion}"
                             selectionMode="single"
                             paginator="true"
                             paginatorPosition="bottom"
                             rows="10"
                             emptyMessage="No hay descuentos"
                             styleClass="tabla">
                    <p:ajax event="rowSelect"
                            listener="#{descuentoModel.onSeleccionarDescuento}"
                            update=":frmDetalle" />
                    <p:ajax event="rowUnselect"
                            listener="#{descuentoModel.onSeleccionarDescuento}"
                            update=":frmDetalle" />

                    <p:column headerText="Nombre">
                        <h:outputText value="#{d.nombre}" />
                    </p:column>

                    <p:column headerText="Tipo">
                        <h:outputText value="#{d.idTipoDescuento.nombre}" />
                    </p:column>

                    <p:column headerText="Desde">
                        <h:outputText value="#{descuentoModel.fechaTexto(d.fechaDesde)}" />
                    </p:column>

                    <p:column headerText="Hasta">
                        <h:outputText value="#{descuentoModel.fechaHastaTexto(d.fechaHasta)}" />
                    </p:column>

                    <p:column headerText="Observaciones">
                        <h:outputText value="#{d.observaciones}" />
                    </p:column>

                    <p:column headerText="Acciones" styleClass="col_acciones">
                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{descuentoModel.editar(d)}"
                                         process="@this"
                                         update=":frmDescuento :frmDetalle :frmLista"
                                         styleClass="btn btn-edit" />
                        &#160;
                        <p:commandButton icon="pi pi-trash"
                                         title="Eliminar"
                                         action="#{descuentoModel.eliminar(d)}"
                                         process="@this"
                                         update=":frmDescuento :frmDetalle :frmLista :growl"
                                         onclick="return confirm('¿Eliminar este descuento?');"
                                         styleClass="btn btn-danger" />
                    </p:column>
                </p:dataTable>
            </article>
        </h:form>
    </ui:define>
</ui:composition>
